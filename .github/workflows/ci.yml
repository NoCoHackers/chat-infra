name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/validation"
          "$RUNNER_TEMP/validation/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/validation/bin" >> "$GITHUB_PATH"
      - name: Check shell syntax
        run: bash -n scripts/deploy.sh
      - name: Validate configuration and discovery files
        run: python3 scripts/validate.py
